<html>
<head><title>NorthBay CU :: Customer Search</title></head>
<body bgcolor="#eef2f6">
<center>
<table class="nb-outer" border="0" cellpadding="0" cellspacing="0"><tr><td class="nb-wrap">
<table class="nb1" border="1" cellpadding="4" cellspacing="0">
<tr><td class="nb2"><font size="2"><b>Customer Search</b></font></td></tr>
<tr><td class="nb3">
<form method="get" action="/tenantb/customers">
<table class="nb4" border="0" cellpadding="2" cellspacing="0">
<tr>
<td class="nb5"><font size="2">Customer ID</font></td>
<td class="nb6"><input type="text" name="q" value="{{ query or '' }}">
{% if query_error %}<font color="red">{{ query_error }}</font>{% endif %}
</td>
<td class="nb7"><input type="button" value="Search" onclick="this.form.submit()"></td>
</tr>
</table>
</form>
</td></tr>
{% if result %}
<tr><td class="nb8">
{% if result.found %}
<font size="2">Found: </font><a href="/tenantb/customer/{{ result.id }}">{{ result.id }} - {{ result.name }}</a>
{% else %}
<font size="2" color="red">No matching record was found.</font>
{% endif %}
</td></tr>
{% endif %}
</table>
</td></tr></table>
</center>
</body>
</html>
