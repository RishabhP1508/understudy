<html>
<head><title>NorthBay CU :: Sign In</title></head>
<body bgcolor="#eef2f6">
<center>
<table class="nb-outer" border="0" cellpadding="0" cellspacing="0"><tr><td class="nb-wrap">
<table class="nb1" border="1" cellpadding="6" cellspacing="0">
<tr><td class="nb2"><font size="4"><b>NorthBay Credit Union Console</b></font></td></tr>
<tr><td class="nb3">
{% if error %}
<font color="red">{{ error }}</font><br>
{% endif %}
<form method="post" action="/tenantb/login">
<table class="nb4" border="0" cellpadding="2" cellspacing="0">
<tr><td class="nb5"><font size="2">User ID</font></td><td class="nb6"><input type="text" name="uid"></td></tr>
<tr><td class="nb5"><font size="2">Password</font></td><td class="nb6"><input type="password" name="pwd"></td></tr>
<tr><td class="nb7" colspan="2"><input type="button" value="Login" onclick="this.form.submit()"></td></tr>
</table>
</form>
</td></tr>
</table>
</td></tr></table>
</center>
</body>
</html>
